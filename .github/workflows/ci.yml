name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, Lint & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests & enforce coverage thresholds
        run: npm run test:coverage

      - name: Run Python client tests
        run: npm run test:python

      - name: Run example smoke suite
        run: npm run examples:smoke

      - name: Verify fixture provenance metadata
        run: |
          node -e "
          const fs = require('node:fs');
          const path = require('node:path');
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (entry.name.endsWith('.json')) {
                const doc = JSON.parse(fs.readFileSync(p, 'utf8'));
                if (typeof doc.verified !== 'boolean') {
                  throw new Error(p + ' missing boolean verified field');
                }
                if (doc.verified && (!doc.source || !String(doc.source).trim())) {
                  throw new Error(p + ' is marked verified=true but lacks source');
                }
              }
            }
          }
          walk('fixtures');
          console.log('All fixture metadata verified.');
          "

      - name: Dependency vulnerability check
        # Runtime dependencies audited with 0 vulnerabilities (zod upgraded to 4.6.7).
        # continue-on-error: true retained due to devDependencies: vitest@3 -> tinypool <=2.1.1
        continue-on-error: true
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

  docker-smoke:
    name: Docker Compose Build & Smoke Test
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Start docker compose stack & run smoke test
        run: |
          docker compose up -d --build
          trap "docker compose logs --no-color; docker compose down -v" EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4000/__control/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4000/__control/health
          curl -fsS http://127.0.0.1:4001/health
          curl -fsS http://127.0.0.1:4002/health
          curl -fsS http://127.0.0.1:4003/health
          curl -fsS -X PUT http://127.0.0.1:4000/__control/scenario/chargily \
            -H "Content-Type: application/json" \
            -d '{"scenario":"duplicate_webhook"}'
          node -e '
            (async () => {
              const state = await fetch("http://127.0.0.1:4000/__control/state").then(r => r.json());
              if (state.defaults?.chargily !== "duplicate_webhook") {
                throw new Error("Expected chargily=duplicate_webhook, got " + JSON.stringify(state));
              }
              const chk = await fetch("http://127.0.0.1:4001/api/v2/checkouts", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer test_sk_ci" },
                body: JSON.stringify({ amount: 1500, currency: "dzd", success_url: "http://127.0.0.1:9999/ok" })
              }).then(r => r.json());
              if (!chk.id || !chk.checkout_url) {
                throw new Error("Unexpected checkout payload: " + JSON.stringify(chk));
              }
              console.log("docker-smoke OK:", chk.id);
            })().catch(e => { console.error(e); process.exit(1); });
          '
