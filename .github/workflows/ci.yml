name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, Lint & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests & enforce coverage thresholds
        run: npm run test:coverage

      - name: Run Python client tests
        run: npm run test:python

      - name: Run example smoke suite
        run: npm run examples:smoke

      - name: Verify fixture provenance metadata
        run: |
          node -e "
          const fs = require('node:fs');
          const path = require('node:path');
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (entry.name.endsWith('.json')) {
                const doc = JSON.parse(fs.readFileSync(p, 'utf8'));
                if (typeof doc.verified !== 'boolean') {
                  throw new Error(p + ' missing boolean verified field');
                }
                if (doc.verified && (!doc.source || !String(doc.source).trim())) {
                  throw new Error(p + ' is marked verified=true but lacks source');
                }
              }
            }
          }
          walk('fixtures');
          console.log('All fixture metadata verified.');
          "

      - name: Dependency vulnerability check
        run: npm audit --audit-level=high

  docker-smoke:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dz-sandbox:ci .

      - name: Start container & run smoke test
        run: |
          docker run -d --name dz-smoke -p 4000:4000 -p 4001:4001 -p 4002:4002 -p 4003:4003 dz-sandbox:ci
          trap "docker logs dz-smoke; docker rm -f dz-smoke" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/__control/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4000/__control/health
          curl -fsS http://127.0.0.1:4001/health
          curl -fsS http://127.0.0.1:4002/health
          curl -fsS http://127.0.0.1:4003/health
          curl -fsS -X PUT http://127.0.0.1:4000/__control/scenario/chargily -H "Content-Type: application/json" -d '{"scenario":"declined"}'
