# Documentation GitHub Pages workflow
# Intentionally limited to manual `workflow_dispatch` triggers until the repository
# maintainer reviews the site and enables automated Pages deployments.
name: Docs Pages (Manual Dispatch Only)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run docs:build
      - run: npm run test:docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-docs
      - id: deployment
        uses: actions/deploy-pages@v4
